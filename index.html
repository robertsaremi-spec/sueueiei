<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storys Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            padding: 1rem;
        }

        .container {
            text-align: center;
        }

        .coming-title {
            font-size: 5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .lang-message {
            font-size: 2.2rem;
            font-weight: 500;
            color: #d4af37;
            margin-top: 1.5rem;
            letter-spacing: 1px;
            direction: ltr;
        }

        .lang-message span {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .coming-title {
                font-size: 3.2rem;
            }
            .lang-message {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="coming-title">Coming Soon</div>
        <div class="lang-message">
            Delicheaesc <span>to</span> Storys Interactive
        </div>
    </div>

</body>
</html>
